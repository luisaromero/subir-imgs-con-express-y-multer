<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Subir imagen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5" style="max-width: 720px">
      <h1 class="mb-4">Subir imagen</h1>
      <form
        id="formUpload"
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
        class="border rounded p-4 bg-white"
      >
        <div class="mb-3">
          <label for="photoInput" class="form-label"
            >Seleccione una imagen (jpg, jpeg, png, gif) máx. 5MB</label
          >
          <input
            type="file"
            class="form-control"
            id="photoInput"
            name="foto"
            accept="image/*"
            required
          />
        </div>

        <!-- Vista previa -->
        <div class="mb-3" id="previewContainer" style="display: none">
          <label class="form-label">Vista previa</label>
          <div>
            <img
              id="imgPreview"
              src=""
              alt="Vista previa"
              class="img-thumbnail"
              style="max-width: 300px"
            />
          </div>
        </div>

        <button class="btn btn-primary" type="submit">Subir</button>
      </form>

      <div id="feedback" class="mt-4" style="display: none"></div>

      <div class="mt-5">
        <h2 class="mb-3">Galería</h2>
        <div id="galleryContainer" class="row g-3">
          <!-- Las imágenes se insertan aquí con JS -->
        </div>
      </div>
    </div>
    <script src="/js/app.js"></script>
  </body>
</html>
